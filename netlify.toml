[build]
publish = "dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "24"

[[redirects]]
from = "/.well-known/*"
to = "/.well-known/:splat"
status = 200

# every deck is a single-page app under /<deck>/ (files that exist are served first)
[[redirects]]
from = "/:deck/*"
to = "/:deck/index.html"
status = 200
